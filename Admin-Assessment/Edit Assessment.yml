info:
  name: Edit Assessment
  type: http
  seq: 3
  tags:
    - Admin/Assessment

http:
  method: PUT
  url: "{{baseUrl}}http://localhost:8000/dashboard/courses/course_id/assessments/assessment_id/"
  body:
    type: json
    data: '"{\r\n    \"course\": 1,\r\n    \"day_number\": 2\r\n}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://localhost:8000/dashboard/courses/course_id/assessments/assessment_id/"
      method: PUT
      body:
        type: json
        data: '"{\r\n    \"course\": 1,\r\n    \"day_number\": 2\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://localhost:8000/dashboard/courses/course_id/assessments/assessment_id/"
      method: PUT
      body:
        type: json
        data: '"{\r\n    \"course\": 1,\r\n    \"day_number\": 2\r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
