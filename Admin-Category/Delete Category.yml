info:
  name: Delete Category
  type: http
  seq: 3
  tags:
    - Admin/Category

http:
  method: DELETE
  url: "{{baseUrl}}http://127.0.0.1:8002/dashboard/categories/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://127.0.0.1:8002/dashboard/categories/"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://127.0.0.1:8002/dashboard/categories/"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
