info:
  name: edit language
  type: http
  seq: 3
  tags:
    - Admin/Language

http:
  method: PUT
  url: "{{baseUrl}}dashboard/languages/1/"
  body:
    type: json
    data: |-
      {
        "language": "Spanish"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://127.0.0.1:800/dashboard/languages/2/"
      method: PUT
      body:
        type: json
        data: '"{\r\n  \"language\": \"Jerman\"\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://127.0.0.1:800/dashboard/languages/2/"
      method: PUT
      body:
        type: json
        data: '"{\r\n  \"language\": \"Jerman\"\r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
