info:
  name: Edit Level
  type: http
  seq: 3
  tags:
    - Admin/Level

http:
  method: PUT
  url: "{{baseUrl}}dashboard/levels/2/"
  body:
    type: json
    data: |-
      {
          "name": "Expert"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://192.168.1.45:8002/dashboard/levels/1/"
      method: PUT
      body:
        type: json
        data: '"{\r\n    \"name\": \"Beginner\"\r\n}\r\n"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://192.168.1.45:8002/dashboard/levels/1/"
      method: PUT
      body:
        type: json
        data: '"{\r\n    \"name\": \"Beginner\"\r\n}\r\n"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
