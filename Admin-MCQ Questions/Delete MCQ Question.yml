info:
  name: Delete MCQ Question
  type: http
  seq: 4
  tags:
    - Admin/MCQ Questions

http:
  method: DELETE
  url: "{{baseUrl}}http://localhostL8000/dashboard/assessments/<int:assessment_id>/mcqs/<int:question_id>/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://localhostL8000/dashboard/assessments/<int:assessment_id>/mcqs/<int:question_id>/"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://localhostL8000/dashboard/assessments/<int:assessment_id>/mcqs/<int:question_id>/"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
