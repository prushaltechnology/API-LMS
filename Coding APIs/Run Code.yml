info:
  name: Run Code
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}api/coding/run/"
  body:
    type: json
    data: |-
      {
        "question_id": 1,
        "code": "a, b = map(int, input().split())\nprint(a + b)"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
