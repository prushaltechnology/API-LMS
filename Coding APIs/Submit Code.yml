info:
  name: Submit Code
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}api/coding/submit/"
  body:
    type: json
    data: |-
      {
        "question_id": 1,
        "language": "java",
        "code": "import java.util.*;public class Submission{public static void main(String[] args){Scanner sc = new Scanner(System.in); int a = sc.nextInt();  int b = sc.nextInt();   System.out.println(a + b);    }}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
