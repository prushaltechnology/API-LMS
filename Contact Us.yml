info:
  name: Contact Us
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}contact-us/"
  body:
    type: json
    data: |-
      {
        "name": "Prajakta Kadam",
        "email": "pratikshayamgar2006@gmail.com",
        "message": "I need help with LMS courses"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://127.0.0.1:8000/api/contact-us/"
      method: POST
      body:
        type: json
        data: '"{\r\n  \"name\": \"Prajakta Kadam\",\r\n  \"email\": \"prajakta@gmail.com\",\r\n  \"message\": \"I need help with LMS courses\"\r\n}\r\n"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://127.0.0.1:8000/api/contact-us/"
      method: POST
      body:
        type: json
        data: '"{\r\n  \"name\": \"Prajakta Kadam\",\r\n  \"email\": \"prajakta@gmail.com\",\r\n  \"message\": \"I need help with LMS courses\"\r\n}\r\n"'
    response:
