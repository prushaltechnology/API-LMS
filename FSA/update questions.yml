info:
  name: update questions
  type: http
  seq: 7
  tags:
    - FSA

http:
  method: PUT
  url: "{{baseUrl}}http://127.0.0.1:8002/api/questions/85/"
  body:
    type: multipart-form
    data:
      - name: assessment
        type: text
        value: "12"
      - name: question_type
        type: text
        value: MIXED_CONTENT
      - name: marks
        type: text
        value: "2"
      - name: negative_marks
        type: text
        value: "0"
      - name: order_no
        type: text
        value: "1"
      - name: is_active
        type: text
        value: "true"
      - name: content_json
        type: text
        value: |-
          {
            "type": "mixed-content",
            "content": [
              {
                "type": "text",
                "value": "test test . UPDATED"
              },
              {
                "type": "text",
                "value": "What is your updated name?"
              },
              {
                "type": "image",
                "image_index": 0
              }
            ],
            "options": [
              {
                "id": "A",
                "image_index": 1
              },
              {
                "id": "B",
                "image_index": 2
              },
              {
                "id": "C",
                "image_index": 3
              },
              {
                "id": "D",
                "image_index": 4
              }
            ],
            "correctAnswer": "B"
          }
      - name: images
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

