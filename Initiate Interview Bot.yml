info:
  name: Initiate Interview Bot
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}initiate-interview/"
  body:
    type: multipart-form
    data:
      - name: is_demo
        type: text
        value: "True"
      - name: interview_type
        type: text
        value: Technical
      - name: difficulty
        type: text
        value: easy
      - name: jdFile
        type: file
        value:
          - C:\Users\Pratik\Downloads\JD_web.pdf
        contentType: application/pdf
      - name: resumeFile
        type: file
        value:
          - C:\Users\Pratik\Downloads\Resume (15).pdf
        contentType: application/pdf
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://localhost:8005/api/initiate-interview/"
      method: POST
      body:
        type: multipart-form
        data:
          - name: is_demo
            type: text
            value: "True"
          - name: interview_type
            type: text
            value: Technical
          - name: difficulty
            type: text
            value: easy
          - name: jdFile
            type: file
            value: []
          - name: resumeFile
            type: file
            value: []
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://localhost:8005/api/initiate-interview/"
      method: POST
      body:
        type: multipart-form
        data:
          - name: is_demo
            type: text
            value: "True"
          - name: interview_type
            type: text
            value: Technical
          - name: difficulty
            type: text
            value: easy
          - name: jdFile
            type: file
            value: []
          - name: resumeFile
            type: file
            value: []
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
