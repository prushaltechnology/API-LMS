info:
  name: Login / Register
  type: http
  seq: 1
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}accounts/register"
  body:
    type: json
    data: |-
      {
        "email": "pratikshayamgar2006@gmail.com"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://127.0.0.1:8000/api/

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://127.0.0.1:8002/api/accounts/register"
      method: POST
      body:
        type: json
        data: '"{\r\n  \"email\": \"prajktakadam927@gmail.com\"\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://127.0.0.1:8002/api/accounts/register"
      method: POST
      body:
        type: json
        data: '"{\r\n  \"email\": \"prajktakadam927@gmail.com\"\r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
