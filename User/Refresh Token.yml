    description: Success
    request:
      url: "{{baseUrl}}https://duncan-announced-britain-continuity.trycloudflare.com/api/accounts/refresh-token"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
