info:
  name: verify otp
  type: http
  seq: 2
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}accounts/verify-otp"
  body:
    type: json
    data: |-
      {
        "user_id": 2,
        "otp": "710645"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://127.0.0.1:8000/api/

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://127.0.0.1:8002/api/accounts/verify-otp"
      method: POST
      body:
        type: json
        data: '"{\r\n  \"user_id\": \"1\",\r\n  \"otp\": \"702862\"\r\n}\r\n"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://127.0.0.1:8002/api/accounts/verify-otp"
      method: POST
      body:
        type: json
        data: '"{\r\n  \"user_id\": \"1\",\r\n  \"otp\": \"702862\"\r\n}\r\n"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
