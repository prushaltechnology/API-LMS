info:
  name: add or remove wishlist
  type: http
  seq: 2
  tags:
    - Wishlist

http:
  method: POST
  url: "{{baseUrl}}http://127.0.0.1:8002/api/wishlist/toggle/"
  body:
    type: json
    data: '"{\r\n  \"course_id\": 1\r\n}"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://127.0.0.1:8002/api/wishlist/toggle/"
      method: POST
      body:
        type: json
        data: '"{\r\n  \"course_id\": 1\r\n}"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://127.0.0.1:8002/api/wishlist/toggle/"
      method: POST
      body:
        type: json
        data: '"{\r\n  \"course_id\": 1\r\n}"'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
