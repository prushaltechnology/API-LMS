info:
  name: get wishlist
  type: http
  seq: 1
  tags:
    - Wishlist
    - User
    - Courses

http:
  method: GET
  url: "{{baseUrl}}http://127.0.0.1:8002/api/courses/"
  params:
    - name: wishlist
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}http://127.0.0.1:8002/api/courses/"
      method: GET
      params:
        - name: wishlist
          value: "true"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}http://127.0.0.1:8002/api/courses/"
      method: GET
      params:
        - name: wishlist
          value: "true"
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
